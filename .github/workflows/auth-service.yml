name: CI Auth Pipeline

on:
  push:
    branches:
      -main
  pull_request:
    branches:
      -main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21'
      
      - name: Download dependencies
        run: go mod download
      
      - name: Build
        run: go build -o auth-service ./cmd/server
      
      - name: Run tests
        run: go test ./...

      - name: Lint
        run: golangci-lint run