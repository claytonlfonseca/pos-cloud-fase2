name: CI Auth Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'services/auth-service/**'
  pull_request:
    branches:
      - main
    paths:
      - 'services/auth-service/**'
  workflow_dispatch:

jobs:
  build:
    name: Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/auth-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'
      
      - name: Download dependencies
        run: |
          go mod tidy
          go mod download
      
      - name: Build
        run: go build -o auth-service .
      
      - name: Run tests
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          working-directory: services/auth-service

  security:
    name: Scan Code Security
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ./services/auth-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: SCA Trivy
        uses: aquasecurity/trivy-action@v0.4.0
        with:
          scan-type: 'fs'
          scan-ref: './services/auth-service'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Trivy JSON Report
        uses: aquasecurity/trivy-action@v0.4.0
        with:
          scan-type: 'fs'
          scan-ref: './services/auth-service'
          format: 'json'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          output: 'trivy-report.json'
      
      - name: upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json  
      
      - name: Run Horusec SAST
        uses: fike/horusec-action@v0.2.2
        with:
          arguments: >
            -p ./services/auth-service
            -o json
            -O horusec-output.json
            --ignore-severity LOW

      - name: upload Horusec Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horusec-report
          path: horusec-output.json
      

          
    
    
    