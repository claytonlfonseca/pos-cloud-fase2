name: CI Auth Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'services/auth-service/**'
  pull_request:
    branches:
      - main
    paths:
      - 'services/auth-service/**'
  workflow_dispatch:

jobs:
  build:
    name: Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/auth-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
      
      - name: Download dependencies
        run: |
          go mod tidy
          go mod download
      
      - name: Build
        run: go build -o auth-service .
      
      - name: Run tests
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          working-directory: services/auth-service

      - name: Run Horusec SAST
        uses: fike/horusec-action@v0.3.0
        with:
          source: 'services/auth-service' 
          arguments: >
            -p ./
            -p json
            -O horusec-output.json
            --ignore-severity LOW
      - name: upload Horusec Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horusec-report
          path: horusec-output.json
      

          
    
    
    