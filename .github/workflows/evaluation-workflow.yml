name: WorkFlow Evaluation Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'services/evaluation-service/**'
  pull_request:
    branches:
      - main
    paths:
      - 'services/evaluation-service/**'
  workflow_dispatch:

env:
  AWS_REGION: "us-east-1"
  ECR_REGISTRY: "fiap-fase2/evaluation-service"
  

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/evaluation-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'
      
      - name: Download dependencies
        run: |
          go mod tidy
          go mod download
      
      - name: Build
        run: go build -o evaluation-service .
      
      - name: Run tests
        run: go test ./...

  linter:
    name: Linter/Static Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          working-directory: services/evaluation-service

  security:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: ./services/evaluation-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: SCA Trivy
        uses: aquasecurity/trivy-action@v0.4.0
        with:
          scan-type: 'fs'
          scan-ref: './services/evaluation-service'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Trivy JSON Report
        uses: aquasecurity/trivy-action@v0.4.0
        with:
          scan-type: 'fs'
          scan-ref: './services/evaluation-service'
          format: 'json'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          output: 'trivy-report.json'
      
      - name: upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json  
      
      - name: Run Horusec SAST
        uses: fike/horusec-action@v0.2.2
        with:
          arguments: >
            -p ./services/evaluation-service
            -o json
            -O horusec-output.json
            -s="LOW,MEDIUM"
            --config-file-path ./services/evaluation-service/horusec-config.json

      - name: upload Horusec Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horusec-report
          path: horusec-output.json

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [security,linter]

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: ./services/evaluation-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Image Tag
        id: generate-tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "IMAGE_TAG=v1.0.0-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REGISTRY }}:${{ steps.generate-tag.outputs.IMAGE_TAG }} \
            .

      - name: Container Image Scan with Trivy
        uses: aquasecurity/trivy-action@v0.4.0
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REGISTRY }}:${{ steps.generate-tag.outputs.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REGISTRY }}:${{ steps.generate-tag.outputs.IMAGE_TAG }}