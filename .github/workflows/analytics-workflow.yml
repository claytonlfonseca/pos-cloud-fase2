name: WorkFlow Analytics Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'services/analytics-service/**'
  pull_request:
    branches:
      - main
    paths:
      - 'services/analytics-service/**'
  workflow_dispatch:

env:
  AWS_REGION: "us-east-1"
  ECR_REGISTRY: "fiap-fase2/analytics-service"


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/analytics-service
    
    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: install dependencies
      run: pip install -r requirements.txt pytest    

  linter:
    name: Linter/Static Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: install dependencies
        run: pip install -r requirements.txt pytest
      
      - name: run linter
        run: pylint *.py --rcfile=.pylintrc